<!DOCTYPE html>
<html lang="en">
  <head id="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="$page.description">
    <link rel="canonical" href="$site.host_url.addPath($page.link())">
    <link rel="icon" type="image/svg+xml" href="$site.asset('favicon.svg').link()">
    <meta property="og:type" content="website">
    <meta property="og:title" content="$page.title">
    <meta property="og:description" content="$page.description">
    <meta property="og:url" content="$site.host_url.addPath($page.link())">
    <title id="title">
      <super>
    </title>
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (e) {}
        var dark = saved === null
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
          : saved === 'dark';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="stylesheet" type="text/css" href="$site.asset('style.css').link()">
    <script defer src="$site.asset('index.js').link()"></script>
    <super>
  </head>
  <body>
    <nav id="menu">
      <button id="theme" type="button" aria-label="Switch theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"></path>
        </svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
      </button>
      <ctx :if="$page.link().eql('/')">
        <a class="active" href="$site.page('').link()">Phi</a>
      </ctx>
      <ctx :if="$page.link().eql('/').not()">
        <a href="$site.page('').link()">Phi</a>
      </ctx>
      <ctx :if="$page.link().eql('/language/')">
        <a class="active" href="$site.page('language').link()">Language</a>
      </ctx>
      <ctx :if="$page.link().eql('/language/').not()">
        <a href="$site.page('language').link()">Language</a>
      </ctx>
      <a href="https://github.com/arshad-yaseen/phi" target="_blank">Source</a>
    </nav>
    <div id="content">
      <super>
    </div>
  </body>
</html>
