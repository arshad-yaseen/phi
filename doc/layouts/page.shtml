<extend template="base.shtml">
<title id="title" :text="$page.title"></title>
<head id="head"></head>
<aside id="toc">
  <ctx :if="$page.link().eql('/').not()">
    <nav class="page-toc" aria-label="On this page">
      <p class="page-toc-title">On this page</p>
      <div :html="$page.toc()"></div>
    </nav>
  </ctx>
</aside>
<div id="content">
  <style>
    #page {
      line-height: 1.65;
    }

    #page h2,
    #page h3,
    #page h4,
    #page h5,
    #page h6 {
      text-align: left;
    }

    #page h2 {
      font-size: 1.95rem;
      line-height: 1.15;
      margin: 2.75rem 0 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px dashed #555;
    }

    #page h3 {
      font-size: 1.35rem;
      line-height: 1.2;
      margin: 2.1rem 0 0.6rem;
    }

    #page h4 {
      font-size: 1.05rem;
      margin: 1.6rem 0 0.5rem;
    }

    /* below h4 the scale runs out, so these separate by weight and colour */
    #page h5 {
      font-size: 0.98rem;
      margin: 1.5rem 0 0.45rem;
      color: #eee;
    }

    #page h6 {
      font-size: 0.92rem;
      margin: 1.4rem 0 0.4rem;
      color: #bbb;
      letter-spacing: 0.02em;
    }

    #page :is(h2, h3, h4, h5, h6) a {
      color: inherit;
      font-weight: inherit;
      text-decoration: none;
    }

    #page :is(h2, h3, h4, h5, h6) a:hover::after {
      content: " #";
      color: #777;
      font-family: 'Merriweather', serif;
      font-size: 0.65em;
      vertical-align: middle;
    }

    #page p {
      margin: 0 0 1.15rem;
      line-height: 1.65;
    }

    #page blockquote {
      margin: 1.5rem 0;
      padding: 0.15rem 0 0.15rem 1.15rem;
      border-left: 2px solid #444;
    }

    #page blockquote p {
      margin: 0.7rem 0;
      color: #c4c4c4;
    }

    #page blockquote p:first-child {
      margin-top: 0;
    }

    #page blockquote p:last-child {
      margin-bottom: 0;
    }

    #page del {
      color: #8a8a8a;
    }

    #page ul,
    #page ol {
      margin: 0 0 1.15rem;
      padding-left: 1.4rem;
    }

    /* a nested list closes its parent item, so it owes no gap below it */
    #page li > ul,
    #page li > ol {
      margin: 0.3rem 0 0;
    }

    #page li {
      margin: 0.35rem 0;
    }

    #page table {
      display: block;
      overflow-x: auto;
      max-width: 100%;
      border-collapse: collapse;
      margin: 1.25rem 0;
      line-height: 1.5;
    }

    #page th,
    #page td {
      padding: 0.5rem 0.8rem;
      text-align: left;
      vertical-align: top;
      overflow-wrap: break-word;
    }

    #page td {
      border-bottom: 1px solid #2a2a2a;
    }

    #page pre {
      margin: 1.25rem 0;
      padding: 0.7rem 0.9rem;
    }

    #page hr {
      border: none;
      border-top: 1px solid #333;
      margin: 2.25rem 0;
    }

    #page figure {
      margin: 1.7rem 0;
      text-align: center;
    }

    #page figcaption {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      line-height: 1.4;
      color: #8a8a8a;
    }

    #page .block {
      margin: 1.5rem 0;
    }

    #page .block p {
      margin: 0.65rem 0;
    }

    #page details.block > summary {
      padding: 0.55rem 0.95rem;
      cursor: pointer;
      font-weight: bold;
      color: #eee;
    }

    #page details.block[open] > summary {
      margin-bottom: 0.5rem;
      border-bottom: 1px dashed #555;
    }

    #page details.block {
      padding-bottom: 0.35rem;
    }
  </style>
  <div id="page" :html="$page.content()"></div>
</div>
