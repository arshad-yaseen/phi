name: docs

# The site is static, so it is rebuilt from `main` rather than from a release.
on:
  push:
    branches: [main]
    paths:
      - "doc/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# a half-published site is worse than a stale one, so a run is never cancelled
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      pages: write # deploy
      id-token: write # OIDC, for deploy-pages
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install Zine
        uses: kristoff-it/setup-zine@46308d08c1c1316d1927adcc3eaaba8037f10c1e # v1
        with:
          version: v0.11.3

      # a page whose snippets no longer compile is a page that teaches a mistake
      - name: Check snippets
        run: |
          zig build
          cd doc && zig run check_snippets.zig

      - name: Build
        working-directory: doc
        run: zine release

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: doc/public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
